<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Закрепите Download webpage as PDF на панели инструментов Chrome и сохраняйте любые веб-страницы в PDF."
    >
    <title>Download webpage as PDF установлено! Вот как начать.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">Download webpage as PDF <span class="headline-keep">установлено!</span></span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Откройте меню «Расширения» (1) в правом верхнем углу Chrome. Затем нажмите значок закрепления (2) рядом с Download webpage as PDF.
        </h2>
        <figure class="browser-shot">
          <img src="assets/pin-extension.png" alt="Откройте меню «Расширения» в Chrome и закрепите Download webpage as PDF">
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          Нажмите по иконке PDF (3), когда хотите сохранить веб-страницу.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Нажмите значок Download webpage as PDF на панели инструментов Chrome">
        </figure>
      </section>
    </main>
  </body>
</html>
